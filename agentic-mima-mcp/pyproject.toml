[project]
name = "agentic-mima-mcp"
version = "0.1.0"
description = "Thin MCP server that exposes the agentic-mima skill's validated scripts as tools."
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0"]

[project.scripts]
agentic-mima-mcp = "mima_mcp.server:main"

[tool.setuptools]
packages = ["mima_mcp", "mima_client"]
